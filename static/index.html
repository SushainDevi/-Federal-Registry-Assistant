<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Federal Registry Assistant</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Federal Registry Assistant</h1>
            <p>Ask questions about Federal Registry documents</p>
        </header>
        
        <main>
            <div class="chat-container">
                <div id="chat-messages" class="chat-messages"></div>
                
                <div class="input-container">
                    <input type="text" id="query-input" placeholder="Ask about Federal Registry documents...">
                    <button id="send-button">Send</button>
                </div>
            </div>
        </main>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
